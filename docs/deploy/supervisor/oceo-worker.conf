; NG-CDF OCEO queue worker (database queue, "default").
; Delivers the email and SMS alerts (App\Jobs\DeliverOutboundMessage).
;
; Install:
;   sudo cp docs/deploy/supervisor/oceo-worker.conf /etc/supervisor/conf.d/oceo-worker.conf
;   (edit the path and user below if the server differs)
;   sudo supervisorctl reread && sudo supervisorctl update
;   sudo supervisorctl status oceo-worker:*
;
; After every deploy: php artisan queue:restart  (workers finish their job and Supervisor restarts them)
;
; --timeout (60) stays below the queue's retry_after (DB_QUEUE_RETRY_AFTER, 90), so a slow
; job is never picked up twice. Retries and backoff come from the job itself.

[program:oceo-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/oceo.ngcdf.go.ke/artisan queue:work database --queue=default --sleep=3 --timeout=60 --max-time=3600 --memory=256
directory=/var/www/oceo.ngcdf.go.ke
user=www-data
numprocs=1
autostart=true
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
stopwaitsecs=70
redirect_stderr=true
stdout_logfile=/var/www/oceo.ngcdf.go.ke/storage/logs/worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
